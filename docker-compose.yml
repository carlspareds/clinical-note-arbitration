services:
  arbiter-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-note-arbitration
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_JUDGE_MODEL=mock-judge
      - ARBITER_LOG_LEVEL=INFO
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./evals:/app/evals
